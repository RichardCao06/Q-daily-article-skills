      - generic [ref=e85]: 以极致为目标，让热爱去燃烧
    - paragraph [ref=e87]:
      - text: 从创始人到工程师、供应链、品控、生产及销售服务团队，每个人都是充满活力的梦想家，每个人都是钟爱机车的骑士面对世界，我们选择简单与纯粹，为拥有相同热爱的人，去提供更为极致的体验,车轮不断向前，一切都是最美好的遇见
      - text: 我们秉承"极致·热爱"的核心价值观，致力于打造"极致品质、极致体验"的产品，并提供"极致关爱"的售前与售后服务期待在不久的将来，在全球都能看到张雪机车的身影，热爱用户、热爱产品、热爱行业，让我们彼此成为可信赖的朋友全方位打造新锐品牌，引领行业营销服务，为客户提供更多玩乐产品价值
