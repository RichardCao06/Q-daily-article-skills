      - strong [ref=e60]: 张雪
      - text: 创始人
    - paragraph [ref=e62]: 一个用梦想书写传奇的追梦人物，用名字命名摩托车品牌，是将自己的人生和摩托车进行深度捆绑。我们眼中的摩托车，并非只是冰冷的机械，更是连接速度与梦想的纽带。我们的梦想是，让中国制造的摩托车在世界舞台上占有一席之地。工程师必须走出去。
